<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅行计划</title><style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#1d1d1f;font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:900px;margin:auto;padding:30px 20px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:.14em;color:#6e6e73;font-weight:700}.title{font-size:34px;margin:4px 0}.muted{color:#6e6e73}.readonly{padding:7px 12px;border-radius:999px;background:#e8f2ff;color:#1266b1;font-size:12px}.panel{background:#fff;border:1px solid #d2d2d7;border-radius:18px;overflow:hidden}.filters{display:flex;gap:8px;padding:14px 18px;border-bottom:1px solid #d2d2d7;overflow:auto}.button{border:0;border-radius:999px;padding:8px 14px;background:#f1f1f3;color:#1d1d1f;white-space:nowrap;cursor:pointer}.button.active{background:#0071e3;color:#fff}.plans{padding:20px}.plan{position:relative;display:flex;gap:18px;min-height:172px;margin-bottom:14px;border:1px solid #d2d2d7;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 5px 14px rgba(0,0,0,.04)}.cover{width:190px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;color:#fff}.stamp{align-self:flex-start;border:1px solid rgba(255,255,255,.85);padding:4px 8px;font-size:12px;transform:rotate(-3deg)}.cover-label{font-size:18px;font-weight:700;line-height:1.3}.copy{padding:20px 52px 18px 0;min-width:0}.status{color:#277c5c;font-size:12px;font-weight:700}.countdown{float:right;color:#c55c4d;font-size:12px}.copy h2{font-size:21px;margin:8px 0 4px}.copy p{margin:5px 0;color:#6e6e73}.route{color:#1d1d1f!important}.progress{height:6px;margin-top:14px;border-radius:6px;background:#eee}.progress i{display:block;height:100%;border-radius:6px;background:#f6c85f}.memory{font-style:italic}.open{display:inline-block;margin-top:10px;color:#0071e3;text-decoration:none}.arrow{position:absolute;right:18px;top:50%;font-size:28px;color:#86868b;transform:translateY(-50%)}.empty{text-align:center;color:#6e6e73;padding:60px 20px}.note{margin-top:14px;padding:12px;border-radius:12px;background:#fff8e8;color:#735b45;font-size:12px}@media(max-width:600px){.top{display:block}.readonly{display:inline-block;margin-top:12px}.cover{width:130px}.copy h2{font-size:18px}}</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">OUR TRAVEL PLANS</div><h1 class="title">旅行计划</h1><div class="muted">AI 生成完整攻略后，这里只负责查看和打开旅行绘本。</div></div><span class="readonly">只读浏览</span></header><section class="panel"><div id="filters" class="filters"></div><div id="plans" class="plans"></div></section><div class="note">计划按“规划中 → 已计划 → 已去过”查看。路线、地点、照片和日记都属于一趟完整旅行；电脑端不提供地点级资料编辑。</div></main><script>var statuses=[['all','全部'],['draft','规划中'],['planned','已计划'],['completed','已去过']];var trips=[{id:'south-xinjiang-2026-restored',title:'南疆自驾 9 日完整版攻略',status:'planned',dateRange:'2026年10月2日—10月10日',days:9,route:'喀什 → 塔县 → 莎车 → 和田 → 库车 → 阿克苏',cover:'#e5a75d',label:'帕米尔 · 沙漠 · 龟兹',progress:86,countdown:'计划中',summary:'喀什进、阿克苏出，包含逐日路线、驾驶时间、地图点位、儿童安全提醒以及照片和日记入口。'}];var selected='all',filtersEl=document.querySelector('#filters'),plansEl=document.querySelector('#plans');function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function render(){filtersEl.innerHTML=statuses.map(function(s){return '<button class="button '+(selected===s[0]?'active':'')+'" data-status="'+s[0]+'">'+s[1]+'</button>'}).join('');var visible=trips.filter(function(t){return selected==='all'||t.status===selected});plansEl.innerHTML=visible.map(function(t){var state=t.status==='completed'?'已去过':t.status==='planned'?'已计划':'规划中';return '<article class="plan"><div class="cover" style="background:'+t.cover+'"><span class="stamp">'+t.days+' 天</span><span class="cover-label">'+esc(t.label)+'</span></div><div class="copy"><span class="status">'+state+'</span><span class="countdown">'+esc(t.countdown||'')+'</span><h2>'+esc(t.title)+'</h2><p>'+esc(t.dateRange)+'</p><p class="route">'+esc(t.route)+'</p><p>'+esc(t.summary)+'</p>'+(t.status==='completed'?'<p class="memory">“旅行回忆已收进成长地图。”</p>':'<div class="progress"><i style="width:'+t.progress+'%"></i></div>')+'<a class="open" href="index.html">打开路线地图 →</a></div><span class="arrow">›</span></article>'}).join('')||'<div class="empty">这个状态下还没有旅行计划。<br>请在电脑端让 AI 生成完整攻略后再同步。</div>'}filtersEl.onclick=function(e){var b=e.target.closest('[data-status]');if(b){selected=b.dataset.status;render()}};render();</script></body></html>

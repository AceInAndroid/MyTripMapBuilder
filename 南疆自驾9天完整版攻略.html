function wgs84ToGcj02(lng, lat) {
  const a = 6378245.0, ee = 0.00669342162296594323, pi = Math.PI;
  if (lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271) return [lng, lat];
  let dLat = -100 + 2*lng + 3*lat + .2*lat*lat + .1*lng*lat + .2*Math.sqrt(Math.abs(lng));
  dLat += (20*Math.sin(6*lng*pi)+20*Math.sin(2*lng*pi))*2/3;
  dLat += (20*Math.sin(lat*pi)+40*Math.sin(lat*pi/3))*2/3;
  dLat += (160*Math.sin(lat*pi/12)+320*Math.sin(lat*pi/30))*2/3;
  let dLng = 300 + lng + 2*lat + .1*lng*lng + .1*lng*lat + .1*Math.sqrt(Math.abs(lng));
  dLng += (20*Math.sin(6*lng*pi)+20*Math.sin(2*lng*pi))*2/3;
  dLng += (20*Math.sin(lng*pi)+40*Math.sin(lng*pi/3))*2/3;
  dLng += (150*Math.sin(lng*pi/12)+300*Math.sin(lng*pi/30))*2/3;
  const radLat = lat / 180 * pi;
  let magic = Math.sin(radLat); magic = 1 - ee*magic*magic;
  const sqrtMagic = Math.sqrt(magic);
  dLat = dLat*180 / ((a*(1-ee))/(magic*sqrtMagic)*pi);
  dLng = dLng*180 / (a/sqrtMagic*Math.cos(radLat)*pi);
  return [lng+dLng, lat+dLat];
}
function amapPos(lat, lng) { return wgs84ToGcj02(lng, lat); }

function addMarker(position, color, label, html, small=false, zIndex=100) {
  const width = small ? 34 : 30;
  const height = small ? 22 : 30;
  const marker = new AMap.Marker({ position, content:markerContent(color,label,small), offset:new AMap.Pixel(-width/2,-height/2), zIndex });
  marker.setMap(map);
  if (html) marker.on('click', () => { infoWindow.setContent(html); infoWindow.open(map, position); });
  return marker;
}

if (HOTEL.lat) addMarker(amapPos(HOTEL.lat,HOTEL.lng), '#ff9500', '🏨', `<b>${HOTEL.name}</b>`, false, 1000);

let markers = [], polylines = [];
const emojis = { food:'🍽️', spot:'📍', hotel:'🏨', transport:'🚃', drink:'🍺' };

function clearMap() { map.remove(markers.concat(polylines)); infoWindow.close(); markers=[]; polylines=[]; }

function showDay(idx) {
  clearMap();
  if (idx === 0) {
    const pts = [];
    DAYS.forEach(d => d.locations.forEach(l => { if(l.lat) pts.push(amapPos(l.lat,l.lng)); }));
    DAYS.slice(1).forEach(d => {
      const routePts = d.locations.filter(l=>l.time!=='—' && l.lat).map(l => amapPos(l.lat,l.lng));
      if(routePts.length > 1) {
        const route = new AMap.Polyline({ map, path:routePts, strokeColor:d.color, strokeWeight:3, strokeOpacity:.72, strokeStyle:'dashed' });
        route.on('click', e => { infoWindow.setContent(`<b>${d.label} · ${d.title}</b><br>🚗 ${d.drive||'按当天路况机动'}<br><span style="color:#86868b">路线为示意线，点击日期查看详细卡片</span>`); infoWindow.open(map,e.lnglat); });
        polylines.push(route);
      }
      d.locations.forEach((l, orderIndex) => {
        if(l.time==='—' || !l.lat) return;
        const orderLabel = `D${d.id}-${orderIndex+1}`;
        const m = addMarker(amapPos(l.lat,l.lng), d.color, orderLabel, `<b>${orderLabel} · ${l.name}</b><br><span style="color:#86868b">${d.label} · ${d.title}</span><br>🚗 ${d.drive||'按当天路况机动'}`, true);
        markers.push(m);
      });
    });
    if(markers.length) map.setFitView(markers.concat(polylines), false, [30,30,30,30], 9);
    return;
  }
  const day = DAYS.find(d=>d.id===idx);
  if(!day) return;
  const coords = [];
  day.locations.forEach((l, orderIndex) => {
    if(!l.lat) return;
    const position = amapPos(l.lat,l.lng);
    const gmapQ = l.gmap||encodeURIComponent(l.name+' 新疆');
    const orderLabel = String(orderIndex+1);
    const html = `<b>${orderLabel} · ${l.name}</b>${l.time!=='—'?'<br><span style="color:#86868b">'+l.time+'</span>':''}<br>${l.desc}${l.budget?'<br><span style="color:#ff9500">'+l.budget+'</span>':''}<br><a href="#" onclick="event.preventDefault();openAS('${l.name.replace(/'/g,"\\'")}',${l.lat},${l.lng},'${gmapQ}')">📍 导航</a>${l.xhs?' · <a href="'+l.xhs+'" target="_blank">📕 小红书</a>':''}`;
    const m = addMarker(position, day.color, orderLabel, html);
    markers.push(m);
    if(l.time!=='—') coords.push(position);
  });
  if(coords.length>1) {
    const pl = new AMap.Polyline({ map, path:coords, strokeColor:day.color, strokeWeight:3, strokeOpacity:.72, strokeStyle:'dashed' });
    pl.on('click', e => { infoWindow.setContent(`<b>${day.label} · ${day.title}</b><br>🚗 ${day.drive||'按当天路况机动'}<br><span style="color:#86868b">行程顺序示意，实际路线以导航为准</span>`); infoWindow.open(map,e.lnglat); });
    polylines.push(pl);
  }
  if(markers.length) map.setFitView(markers.concat(polylines), false, [40,40,40,40], 14);
}

function payChips(pay) {
  if(!pay) return '';
  let h = '<div class="pays">';
  const m = { cash:'💴', card:'💳', suica:'Suica', paypay:'PayPay', alipay:'支付宝', wechat:'微信' };
  for(const [k,label] of Object.entries(m)) {
    if(pay[k]!==undefined) { const c = pay[k]===1?'ok':pay[k]===0.5?'idk':'no'; h += `<span class="pay ${c}">${label}</span>`; }
  }
  return h+'</div>';
}

// ── 运行环境检测：在第三方 App 的 WebView 里，自定义 scheme 基本会被拦截 ──
const IN_APP_WEBVIEW = (() => {
  const ua = (navigator.userAgent || '').toLowerCase();
  return /micromessenger|xhs|xhsdiscover|discover\/|tiktok|aweme|weibo|qq\/|qqbrowser|alipayclient|dingtalk|lark|feishu|ucbrowser|baiduboxapp|toutiao|newsarticle/.test(ua);
})();

function xhsKeyword(loc) {
  if(loc.xhsKeyword) return loc.xhsKeyword.trim();
  return (loc.name||'').replace(/⭐.*$/g,'').replace(/（.*?）/g,'').replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim();
}
function xhsAppUrl(loc) { return `xhsdiscover://search/result?keyword=${encodeURIComponent(xhsKeyword(loc))}&target_search=notes&source=deeplink`; }
function xhsWebUrl(loc) { return `https://www.xiaohongshu.com/search_result?keyword=${encodeURIComponent(xhsKeyword(loc))}&source=web_explore_feed`; }

function dpKeyword(loc) {
  if(loc.dianpingKeyword) return loc.dianpingKeyword.trim();
  return (loc.name||'').replace(/⭐.*$/g,'').replace(/（.*?）/g,'').replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim();
}
function dpAppUrl(loc) { return `dianping://searchshoplist?keyword=${encodeURIComponent(dpKeyword(loc))}`; }
function dpWebUrl(loc) { return `https://m.dianping.com/searchshop?keyword=${encodeURIComponent(dpKeyword(loc))}`; }

window._extLocs = {};
DAYS.forEach(d => d.locations.forEach(l => { window._extLocs[`${d.id}::${l.name}`] = l; }));
window._xhsLocs = window._extLocs;

function openExt(key, kind) {
  const loc = window._extLocs[key]; if(!loc) return false;
  if (IN_APP_WEBVIEW) {
    window.location.href = kind==='dp' ? dpWebUrl(loc) : xhsWebUrl(loc);
  } else {
    window.location.href = kind==='dp' ? dpAppUrl(loc) : xhsAppUrl(loc);
  }
  return false;
}
function openXhs(key) { return openExt(key, 'xhs'); }
function openDp(key)  { return openExt(key, 'dp'); }

function locCard(loc, dayIdx, orderIndex, dayColor) {
  const dot = loc.type==='food'?'food':loc.type==='spot'?'spot':loc.type==='drink'?'drink':loc.type==='hotel'?'hotel':'transport';
  const bdg = loc.type==='food'?'<span class="badge food">餐</span>':loc.type==='spot'?'<span class="badge spot">景</span>':loc.type==='drink'?'<span class="badge drink">饮</span>':'';
  const uid = `d${dayIdx}-${loc.name.replace(/\W/g,'')}`;
  const locKey = `${dayIdx}::${loc.name}`;
  const gmapQ = loc.gmap||encodeURIComponent(loc.name+' 新疆');
  let lnk = `<button class="btn nav" onclick="openAS('${loc.name.replace(/'/g,"\\'")}',${loc.lat},${loc.lng},'${gmapQ}')">📍 导航</button>`;
  if(loc.xhs||loc.xhsKeyword) {
    const xhsHref = IN_APP_WEBVIEW ? xhsWebUrl(loc) : xhsAppUrl(loc);
    const xhsLabel = IN_APP_WEBVIEW ? '📕 小红书' : '📕 小红书 App';
    lnk += `<a href="${xhsHref}" onclick="return openXhs('${locKey.replace(/'/g,"\\'")}')" class="btn xhs">${xhsLabel}</a>`;
  }
  const dpEnabled = loc.dianping !== false &&
    (loc.dianping || loc.dianpingKeyword || loc.type==='food' || loc.type==='drink');
  if(dpEnabled) {
    const dpHref = IN_APP_WEBVIEW ? dpWebUrl(loc) : dpAppUrl(loc);
    const dpLabel = IN_APP_WEBVIEW ? '🍜 大众点评' : '🍜 大众点评 App';
    lnk += `<a href="${dpHref}" onclick="return openDp('${locKey.replace(/'/g,"\\'")}')" class="btn dp">${dpLabel}</a>`;
  }
  if(loc.reserve) lnk += `<a href="${loc.reserve}" target="_blank" class="btn rsv">📅 预约</a>`;
  return `<div class="tl-item"><div class="tl-dot ${dot}"></div><div class="card" onclick="if(!event.target.closest('.btn,.links'))toggle('${uid}')"><div class="time">${loc.time!=='—'?loc.time:'备选'}</div><div class="name"><span class="order-badge" style="background:${dayColor}">${orderIndex+1}</span>${bdg} ${loc.name}</div><div class="desc">${loc.desc}</div>${loc.budget?'<div class="budget">'+loc.budget+'</div>':''}${payChips(loc.pay)}<div class="links">${lnk}</div>${loc.detail?'<div class="details" id="'+uid+'">'+loc.detail.replace(/\n/g,'<br>')+'</div>':''}</div></div>`;
}

function renderDay(idx) {
  const d = DAYS.find(x=>x.id===idx); if(!d) return '';
  const main = d.locations.filter(l=>l.time!=='—');
  const alt = d.locations.filter(l=>l.time==='—');
  let h = `<div class="day-head"><h2>${d.title}</h2><p>${d.date}</p></div>`;
  h += `<div class="route-bar"><strong>🚗 当天驾驶</strong>\n${d.drive||'按当天路况机动'}\n<span style="font-size:12px">地图折线为点位顺序示意，实际驾驶请使用导航。</span></div>`;
  if(main.length) { h += '<div class="section-head">行程</div><div class="timeline">'; main.forEach(l => h += locCard(l, idx, d.locations.indexOf(l), d.color)); h += '</div>'; }
  if(alt.length) { h += '<div class="section-head">备选</div><div class="timeline">'; alt.forEach(l => h += locCard(l, idx, d.locations.indexOf(l), d.color)); h += '</div>'; }
  return h;
}

  contentEl.innerHTML = idx===0 ? overviewContent() : idx===NOTES_TAB_ID ? renderNotes() : idx===FOOD_TAB_ID ? renderFood() : renderDay(idx);
  const isReadingTab = idx===NOTES_TAB_ID || idx===FOOD_TAB_ID;
  document.body.classList.toggle('notes-mode', isReadingTab);
  document.querySelector('.manager-link').hidden = idx !== 0;
  if(isReadingTab) { document.getElementById('map').style.display='none'; } else { document.getElementById('map').style.display=''; showDay(idx); }
  window.scrollTo({top:0, behavior:'instant'});
  const tab = tabsEl.querySelector(`[data-day="${idx}"]`);
  if(tab) tab.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
}

function toggle(id) { const el=document.getElementById(id); if(el) el.classList.toggle('closed'); }

tabsEl.addEventListener('click', e => { const t=e.target.closest('.tab'); if(t) go(+t.dataset.day); });

go(0);

/* ── PDF export: direct download via html2pdf.js, with native print fallback ── */
const printRoot = document.getElementById('print-root');
const pdfButton = document.querySelector('.pdf-export');
const pdfStatus = document.getElementById('pdf-status');
const defaultTitle = document.title;
function buildPrintDocument() {
  printRoot.innerHTML = `${overviewContent()}${renderNotes(true)}${renderFood()}<p class="print-note">导出说明：地图未嵌入打印稿；路线、封路和实时驾驶时间以出发当天高德导航为准。</p>` +
    DAYS.slice(1).map(d => `<section class="print-day">${renderDay(d.id)}</section>`).join('');
}
function nativePrintPDF() {
  buildPrintDocument();
  document.title = '南疆自驾9天完整版攻略';
  requestAnimationFrame(() => setTimeout(() => window.print(), 80));
}
async function exportPDF() {
  buildPrintDocument();
  if (typeof window.html2pdf !== 'function') {
    nativePrintPDF();
    return;
  }

  pdfButton.disabled = true;
  pdfButton.textContent = '生成中…';
  pdfStatus.classList.add('active');
  printRoot.classList.add('exporting');
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    await window.html2pdf().set({
      margin: [10, 10, 10, 10],
      filename: '南疆自驾9天完整版攻略.pdf',
      image: { type: 'jpeg', quality: 0.96 },
      html2canvas: {
        scale: 2,
        useCORS: true,
        logging: false,
        backgroundColor: '#ffffff',
        scrollY: 0,
        windowHeight: printRoot.scrollHeight
      },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css'], before: '.print-day', avoid: ['p', '.name', '.desc', '.details', 'h1', 'h2', 'h3', 'h4', '.tl-item', '.card', '.route-bar', '.pay-summary'] }
    }).from(printRoot).save();
  } catch (error) {
    console.error('html2pdf export failed; falling back to browser print.', error);
    nativePrintPDF();
  } finally {
    printRoot.classList.remove('exporting');
    pdfStatus.classList.remove('active');
    pdfButton.disabled = false;
    pdfButton.textContent = '⬇️ 导出 PDF';
  }
}
window.addEventListener('beforeprint', buildPrintDocument);
window.addEventListener('afterprint', () => {
  document.title = defaultTitle;
});

/* ── Action Sheet for Navigation ── */
const asOverlay = document.createElement('div');
asOverlay.className = 'as-overlay';
asOverlay.innerHTML = `<div class="as-sheet">
  <div class="as-group" id="as-opts"></div>
  <div class="as-group"><button class="as-item as-cancel" onclick="closeAS()">取消</button></div>
</div>`;
document.body.appendChild(asOverlay);
asOverlay.addEventListener('click', e => { if (e.target === asOverlay) closeAS(); });

const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
function amapAppUrl(name, lat, lng) {
  const scheme = IS_IOS ? 'iosamap' : 'androidamap';
  return `${scheme}://viewMap?sourceApplication=trip&poiname=${encodeURIComponent(name)}&lat=${lat}&lon=${lng}&dev=0`;
}
function amapWebUrl(name, lat, lng) {
  return `https://uri.amap.com/marker?position=${lng},${lat}&name=${encodeURIComponent(name)}&src=trip&coordinate=wgs84&callnative=1`;
}
function openAmap(name, lat, lng) {
  if (IN_APP_WEBVIEW) { window.open(amapWebUrl(name, lat, lng)); return; }
  window.location.href = amapAppUrl(name, lat, lng);
}

function openAS(name, lat, lng, gmap) {
  const q = gmap || encodeURIComponent(name + ' 新疆');
  const encName = encodeURIComponent(name);
  const safeName = name.replace(/'/g,"\\'");
  // WebView 内 maps:// 通常被拦截，改用 https Apple Maps URL —— iOS 系统会自动拉起 Apple Maps
  const appleUrl = IN_APP_WEBVIEW
    ? `https://maps.apple.com/?q=${lat},${lng}&ll=${lat},${lng}&name=${encName}`
    : `maps://maps.apple.com/?q=${lat},${lng}&name=${encName}`;
  const googleUrl = `https://www.google.com/maps/search/?api=1&query=${q}`;
  document.getElementById('as-opts').innerHTML =
    `<button class="as-item" onclick="window.open('${appleUrl}');closeAS()">🍎 Apple Maps</button>` +
    `<button class="as-item" onclick="window.open('${googleUrl}');closeAS()">🗺️ Google Maps</button>` +
    `<button class="as-item" onclick="openAmap('${safeName}',${lat},${lng});closeAS()">🧭 高德地图 App</button>`;
  asOverlay.classList.add('show');
}
function closeAS() { asOverlay.classList.remove('show'); }
</script>
